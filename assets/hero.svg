<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Kanmon PM case banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafcfe"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a33"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- funnel, right side -->
  <g transform="translate(760,60)">
    <rect x="0"   y="0"   width="52" height="180" rx="6" fill="url(#bar)"/>
    <rect x="64"  y="52"  width="52" height="128" rx="6" fill="url(#bar)" opacity=".88"/>
    <rect x="128" y="88"  width="52" height="92"  rx="6" fill="url(#bar)" opacity=".76"/>
    <rect x="192" y="118" width="52" height="62"  rx="6" fill="url(#bar)" opacity=".64"/>
    <rect x="256" y="140" width="52" height="40"  rx="6" fill="url(#bar)" opacity=".52"/>
    <rect x="320" y="156" width="52" height="24"  rx="6" fill="url(#bar)" opacity=".45"/>
    <text x="26"  y="-12" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c25200">8,000</text>
    <text x="346" y="146" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c25200">51</text>
    <text x="186" y="206" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">saw it → funded, simulated month</text>
  </g>

  <!-- copy, left side -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="64" y="92" font-size="15" font-weight="800" letter-spacing="3" fill="#FF6B00">KANMON PM CASE</text>
    <text x="64" y="146" font-size="42" font-weight="800" letter-spacing="-1" fill="#0f172a">A pre-approval estimate,</text>
    <text x="64" y="192" font-size="42" font-weight="800" letter-spacing="-1" fill="#0f172a">and an application you can finish</text>
    <g transform="translate(64,222)" font-size="14" font-weight="600">
      <rect x="0" y="0" width="118" height="30" rx="15" fill="#fff" stroke="#e2e8f0"/>
      <text x="59" y="20" text-anchor="middle" fill="#334155">16 slides</text>
      <rect x="128" y="0" width="142" height="30" rx="15" fill="#fff" stroke="#e2e8f0"/>
      <text x="199" y="20" text-anchor="middle" fill="#334155">working demo</text>
      <rect x="280" y="0" width="140" height="30" rx="15" fill="#fff" stroke="#e2e8f0"/>
      <text x="350" y="20" text-anchor="middle" fill="#334155">full build log</text>
    </g>
  </g>
</svg>
